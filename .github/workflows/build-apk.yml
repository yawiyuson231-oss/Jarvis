name: Build Android APK

on:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "android/**"
      - "assets/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test-output.log

      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          grep -n -E -A 20 -B 8 '(\[E\]|Expected:|Actual:|Test failed|EXCEPTION|Failed assertion|error:)' test-output.log | tail -300 > test-failures.txt || true
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          details = Path('test-failures.txt').read_text()[-20000:]
          for index in range(0, len(details), 1000):
              part = index // 1000 + 1
              chunk = details[index:index + 1000]
              print(f'::error title=Flutter test failures {part}::' + quote(chunk))
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK artifact
        run: |
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-release.apk artifact/Jarvis-v1.1.1.apk
          sha256sum artifact/Jarvis-v1.1.1.apk > artifact/Jarvis-v1.1.1.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-v1.1.1-apk
          path: |
            artifact/Jarvis-v1.1.1.apk
            artifact/Jarvis-v1.1.1.apk.sha256
          if-no-files-found: error
          retention-days: 30
