name: Transfer built APK

on:
  push:
    paths:
      - ".github/workflows/transfer-apk.yml"

permissions:
  actions: read
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: Jarvis-v1.1.0-apk
          path: transfer
          repository: yawiyuson231-oss/Jarvis
          run-id: "42344671729"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create temporary transfer tag
        run: |
          test -f transfer/Jarvis-v1.1.0.apk
          mkdir -p apk-transfer
          cp transfer/Jarvis-v1.1.0.apk transfer/Jarvis-v1.1.0.apk.sha256 apk-transfer/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk-transfer/
          git commit -m "Temporary APK transfer [skip ci]"
          git tag jarvis-apk-transfer-42344671729
          git push origin jarvis-apk-transfer-42344671729
